# Lines these add-ons need in mpv.conf. Put them into your own mpv.conf.

# the stock on-screen bar is replaced by scripts/osc.lua (video-side bar)
osc=no

# only remember the playback position per file (nothing else leaks from video to video)
watch-later-options=start

# Python is found by itself (python, py, python3, the per-user install). Only if it is somewhere else:
#script-opts-append=mpv-custom-python=C:\Path\To\python.exe
